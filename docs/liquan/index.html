<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>李权的第二个作品 — 宜宾 | Liquan</title>
  <meta name="description" content="李权的第二个作品 — 简单介绍页面，包含蜀南竹海图片与三江口视频展示。" />
  <meta property="og:title" content="李权的第二个作品 — 宜宾" />
  <meta property="og:description" content="李权的第二个作品 — 蜀南竹海与三江口展示" />
  <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/2/28/Shunan_Bamboo_Forest_in_Yibin_Sichuan_China.jpg" />
  <link rel="icon" href="/docs/liquan/favicon.ico" />
  <style>
    :root{ --bg: #031027; --card:#07263d; --text:#eaf6ff; --muted:#9fb2c8; --accent:#2b79ff }
    *{box-sizing:border-box}
    body{margin:0;font-family: "Microsoft YaHei", Arial, sans-serif;background:linear-gradient(180deg,#021021,#031027);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:2rem}
    .site{width:min(900px,98%);background:linear-gradient(180deg,rgba(255,255,255,0.02),rgba(255,255,255,0.01));border-radius:12px;padding:1.25rem 1.5rem;box-shadow:0 10px 40px rgba(2,8,20,0.6)}
    header{display:flex;gap:1rem;align-items:center}
    h1{margin:0;font-size:1.6rem;color:var(--accent)}
    p.lead{margin:0;color:var(--muted);}
    .media{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
    .photo{background:var(--card);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0.5rem}
    .photo img{width:100%;height:100%;object-fit:cover;display:block}
    .video{background:var(--card);border-radius:8px;padding:0.5rem}
    .desc{margin-top:1rem;color:var(--muted);font-size:0.95rem}
    footer{margin-top:1rem;text-align:center;color:var(--muted);font-size:0.85rem}
    @media(max-width:720px){.media{grid-template-columns:1fr}h1{font-size:1.3rem}}
  </style>
</head>
<body>
  <main class="site">
    <header>
      <div>
        <h1>李权的第二个作品</h1>
        <p class="lead">来自四川宜宾 · 简单展示：一张蜀南竹海的图片与一段三江口的视频。</p>
      </div>
    </header>

    <section class="media" aria-label="媒体展示">
      <figure class="photo" aria-labelledby="photo-caption">
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/28/Shunan_Bamboo_Forest_in_Yibin_Sichuan_China.jpg" alt="蜀南竹海风光" />
        <figcaption id="photo-caption" style="display:none">蜀南竹海（来源：Wikimedia Commons / CC BY-SA 3.0）</figcaption>
      </figure>

      <div class="video" aria-labelledby="video-caption">
        <!-- 嵌入示例：YouTube 视频（请在使用前确认许可） -->
        <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:6px">
          <iframe src="https://www.youtube.com/embed/feq7XicoAHM" title="三江口 航拍" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%"></iframe>
        </div>
        <p id="video-caption" style="margin-top:0.5rem;color:var(--muted);font-size:0.9rem">三江口航拍视频（来源示例：YouTube，使用前请核实视频许可）</p>
      </div>
    </section>

    <p class="desc">这是李权的第二个作品。图片使用自 Wikimedia Commons（Shunan Bamboo Forest in Yibin, CC BY-SA 3.0）。视频为网络嵌入，请在商业或公开展示前再次核实视频页面的授权信息。</p>

    <footer>
      图片来源：<a href="https://commons.wikimedia.org/wiki/File:Shunan_Bamboo_Forest_in_Yibin_Sichuan_China.jpg" target="_blank" rel="noopener" style="color:var(--muted)">Wikimedia Commons</a>（CC BY-SA 3.0）
      <br />视频来源示例：<a href="https://www.youtube.com/watch?v=feq7XicoAHM" target="_blank" rel="noopener" style="color:var(--muted)">YouTube</a>
    </footer>
  </main>
</body>
</html>
